[global]
# Reaches the functions runtime as process.env. NHOST_* and HASURA_* are injected
# automatically; anything else has to be declared here.
# HASURA_GRAPHQL_UNAUTHORIZED_ROLE is deliberately absent. nhost already resolves an
# unauthenticated request to role `public`, and setting it here is rejected by the cloud
# config schema, which forbids reserved HASURA_* names in global.environment — the local
# CLI validates that more loosely, so it passed locally and failed on deploy.
#
# The inbound webhook Action is exposed to `public`. Safe because no table grants `public`
# anything: the only thing reachable without a session is that one Action, and its own
# token is what authorizes it.
[[global.environment]]
name = 'LLM_API_KEY'
value = '{{ secrets.LLM_API_KEY }}'

[[global.environment]]
name = 'LLM_BASE_URL'
value = 'https://api.groq.com/openai/v1'

[[global.environment]]
name = 'LLM_MODEL'
value = 'llama-3.3-70b-versatile'

[hasura]
version = 'v2.49.2-ce'
adminSecret = '{{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}'
webhookSecret = '{{ secrets.NHOST_WEBHOOK_SECRET }}'

[[hasura.jwtSecrets]]
type = 'HS256'
key = '{{ secrets.HASURA_GRAPHQL_JWT_SECRET }}'

[hasura.settings]
corsDomain = ['*']
devMode = true
enableAllowList = false
enableConsole = true
enableRemoteSchemaPermissions = false
enabledAPIs = ['metadata', 'graphql', 'pgdump', 'config']
inferFunctionPermissions = true
liveQueriesMultiplexedRefetchInterval = 1000
stringifyNumericTypes = false

[hasura.logs]
level = 'warn'

[hasura.events]
httpPoolSize = 100

[functions]
[functions.node]
version = 22

[auth]
version = '0.49.1'

[auth.elevatedPrivileges]
mode = 'disabled'

[auth.redirections]
clientUrl = 'http://localhost:3000'

[auth.signUp]
enabled = true
disableNewUsers = false

[auth.user]
[auth.user.roles]
default = 'user'
allowed = ['user', 'me', 'owner', 'editor', 'viewer']

[auth.user.locale]
default = 'en'
allowed = ['en']

[auth.user.gravatar]
enabled = true
default = 'blank'
rating = 'g'

[auth.user.email]

[auth.user.emailDomains]

[auth.session]
[auth.session.accessToken]
expiresIn = 900

[auth.session.refreshToken]
expiresIn = 2592000

[auth.method]
[auth.method.anonymous]
enabled = false

[auth.method.emailPasswordless]
enabled = false

[auth.method.otp]
[auth.method.otp.email]
enabled = false

[auth.method.emailPassword]
hibpEnabled = false
emailVerificationRequired = false
passwordMinLength = 9

[auth.method.smsPasswordless]
enabled = false

[auth.method.oauth]
[auth.method.oauth.apple]
enabled = false

[auth.method.oauth.azuread]
tenant = 'common'
enabled = false

[auth.method.oauth.bitbucket]
enabled = false

[auth.method.oauth.discord]
enabled = false

[auth.method.oauth.entraid]
tenant = 'common'
enabled = false

[auth.method.oauth.facebook]
enabled = false

[auth.method.oauth.github]
enabled = false

[auth.method.oauth.gitlab]
enabled = false

[auth.method.oauth.google]
enabled = false

[auth.method.oauth.linkedin]
enabled = false

[auth.method.oauth.spotify]
enabled = false

[auth.method.oauth.strava]
enabled = false

[auth.method.oauth.twitch]
enabled = false

[auth.method.oauth.twitter]
enabled = false

[auth.method.oauth.windowslive]
enabled = false

[auth.method.oauth.workos]
enabled = false

[auth.method.webauthn]
enabled = false

[auth.method.webauthn.attestation]
timeout = 60000

[auth.totp]
enabled = false

[auth.misc]
concealErrors = false

[auth.rateLimit]
[auth.rateLimit.emails]
limit = 10
interval = '1h'

[auth.rateLimit.sms]
limit = 10
interval = '1h'

[auth.rateLimit.bruteForce]
# The default of 10 per 5 minutes is keyed by IP, and this app's demo signs four users in
# from one machine, sometimes across several browsers, alongside the verification suites.
# 60 attempts in five minutes is still nowhere near a viable attack against the 9-plus
# character minimum, and it removes a limiter trip that would look like a broken app.
limit = 60
interval = '5m'

[auth.rateLimit.signups]
limit = 10
interval = '5m'

[auth.rateLimit.global]
limit = 100
interval = '1m'

[postgres]
version = '14.20-20251217-1'

[postgres.resources]
[postgres.resources.storage]
capacity = 1

[provider]

[storage]
version = '0.15.0'

[observability]
[observability.grafana]
adminPassword = '{{ secrets.GRAFANA_ADMIN_PASSWORD }}'

[observability.grafana.alerting]
enabled = false

[observability.grafana.contacts]
