actions:
  - name: approveStep
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/actions/approve-step'
    permissions:
      - role: owner
      - role: editor
    comment: Clears a paused approval gate after re-checking the approver's role in the org
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/actions/trigger-workflow-run'
    permissions:
      - role: owner
      - role: editor
    comment: Starts a run for a workflow the caller may trigger in their own organization
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
    - name: ApproveStepOutput
  scalars: []
