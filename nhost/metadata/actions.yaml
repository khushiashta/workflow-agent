actions:
  - name: approveStep
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/actions/approve-step'
    permissions:
      - role: owner
      - role: editor
    comment: Clears a paused approval gate after re-checking the approver's role in the org
  - name: createWebhookTrigger
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/actions/create-webhook-trigger'
    permissions:
      - role: owner
    comment: Mints a webhook token for a workflow and returns the plaintext exactly once
  - name: startWorkflowRunViaWebhook
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/actions/start-workflow-run-via-webhook'
    permissions:
      - role: public
    comment: Inbound endpoint for external systems; authorized entirely by its per-trigger token
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/actions/trigger-workflow-run'
    permissions:
      - role: owner
      - role: editor
    comment: Starts a run for a workflow the caller may trigger in their own organization
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
    - name: ApproveStepOutput
    - name: CreateWebhookTriggerOutput
    - name: WebhookTriggerOutput
  scalars: []
