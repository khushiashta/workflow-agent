table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: triggered_by_user
    using:
      foreign_key_constraint_on: triggered_by
  - name: workflow
    using:
      manual_configuration:
        column_mapping:
          workflow_id: id
        insertion_order: null
        remote_table:
          name: workflows
          schema: public
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
select_permissions:
  - role: editor
    permission:
      columns:
        - id
        - workflow_id
        - org_id
        - status
        - trigger_type
        - triggered_by
        - context
        - error
        - resume_from_step_order
        - started_at
        - finished_at
        - created_at
        - updated_at
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: editor
      limit: 100
      allow_aggregations: true
  - role: owner
    permission:
      columns:
        - id
        - workflow_id
        - org_id
        - status
        - trigger_type
        - triggered_by
        - context
        - error
        - resume_from_step_order
        - started_at
        - finished_at
        - created_at
        - updated_at
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      limit: 100
      allow_aggregations: true
  - role: viewer
    permission:
      columns:
        - id
        - workflow_id
        - org_id
        - status
        - trigger_type
        - triggered_by
        - context
        - error
        - resume_from_step_order
        - started_at
        - finished_at
        - created_at
        - updated_at
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: viewer
      limit: 100
      allow_aggregations: true
