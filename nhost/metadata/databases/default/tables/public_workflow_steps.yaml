table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_step_id
        table:
          name: step_runs
          schema: public
insert_permissions:
  - role: editor
    permission:
      check:
        workflow:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: editor
      set:
        created_by: x-hasura-user-id
      columns:
        - workflow_id
        - step_order
        - step_type
        - name
        - config
  - role: owner
    permission:
      check:
        workflow:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
      set:
        created_by: x-hasura-user-id
      columns:
        - workflow_id
        - step_order
        - step_type
        - name
        - config
select_permissions:
  - role: editor
    permission:
      columns:
        - id
        - workflow_id
        - step_order
        - step_type
        - name
        - config
        - created_by
        - created_at
        - updated_at
      filter:
        workflow:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
