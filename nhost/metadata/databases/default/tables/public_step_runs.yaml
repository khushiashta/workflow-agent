table:
  name: step_runs
  schema: public
object_relationships:
  - name: approver
    using:
      foreign_key_constraint_on: approved_by
  - name: step
    using:
      foreign_key_constraint_on: workflow_step_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
select_permissions:
  - role: editor
    permission:
      columns:
        - id
        - workflow_run_id
        - workflow_step_id
        - step_order
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - approval_comment
        - started_at
        - finished_at
        - created_at
        - updated_at
      filter:
        workflow_run:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: editor
      limit: 500
  - role: owner
    permission:
      columns:
        - id
        - workflow_run_id
        - workflow_step_id
        - step_order
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - approval_comment
        - started_at
        - finished_at
        - created_at
        - updated_at
      filter:
        workflow_run:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
      limit: 500
  - role: viewer
    permission:
      columns:
        - id
        - workflow_run_id
        - workflow_step_id
        - step_order
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - approval_comment
        - started_at
        - finished_at
        - created_at
        - updated_at
      filter:
        workflow_run:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: viewer
      limit: 500
