table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: editor
    permission:
      check:
        _and:
          - workflow:
              organization:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _eq: editor
          - trigger_type:
              _nin:
                - webhook
      set:
        created_by: x-hasura-user-id
      columns:
        - id
        - workflow_id
        - trigger_type
        - is_enabled
        - config
  - role: owner
    permission:
      check:
        workflow:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
      set:
        created_by: x-hasura-user-id
      columns:
        - id
        - workflow_id
        - trigger_type
        - is_enabled
        - config
