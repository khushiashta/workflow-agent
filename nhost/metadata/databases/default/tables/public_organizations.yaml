table:
  name: organizations
  schema: public
object_relationships:
  - name: usage_summary
    using:
      manual_configuration:
        column_mapping:
          id: org_id
        insertion_order: null
        remote_table:
          name: org_usage_summary
          schema: public
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: runs
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflow_runs
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
select_permissions:
  - role: editor
    permission:
      columns:
        - id
        - name
        - slug
        - quota_calls_allowed
        - quota_calls_used
        - quota_period_started_at
        - created_at
        - updated_at
      filter:
        members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: editor
  - role: owner
    permission:
      columns:
        - id
        - name
        - slug
        - quota_calls_allowed
        - quota_calls_used
        - quota_period_started_at
        - created_at
        - updated_at
      filter:
        members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
  - role: user
    permission:
      columns:
        - id
        - name
        - slug
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns:
        - id
        - name
        - slug
        - quota_calls_allowed
        - quota_calls_used
        - quota_period_started_at
        - created_at
        - updated_at
      filter:
        members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: viewer
update_permissions:
  - role: owner
    permission:
      columns:
        - name
      filter:
        members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
      check:
        members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
