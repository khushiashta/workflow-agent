type Mutation {
  approveStep(
    step_run_id: uuid!
    comment: String
  ): ApproveStepOutput!
}

type Mutation {
  triggerWorkflowRun(
    workflow_id: uuid!
    payload: jsonb
  ): TriggerWorkflowRunOutput!
}

type TriggerWorkflowRunOutput {
  workflow_run_id: uuid!
  status: String!
}

type ApproveStepOutput {
  step_run_id: uuid!
  workflow_run_id: uuid!
  status: String!
}

